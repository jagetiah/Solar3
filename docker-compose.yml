version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: solaros
      POSTGRES_USER: solaros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solaros"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://solaros:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/solaros
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  pgdata:
